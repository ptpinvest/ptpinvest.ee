<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTP Invest — Family Office</title>
<meta name="description" content="PTP Invest is a private family office. Legacy isn't luck — it's crafted.">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="PTP Invest — Family Office">
<meta property="og:description" content="Legacy isn't luck — it's crafted. At PTP Invest, we thrive where others hesitate.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ptpinvest.ee">
<meta property="og:image" content="https://ptpinvest.ee/static/img/logo.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://ptpinvest.ee">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0a0a'/><text y='66' x='50' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-size='44' font-weight='700' fill='%23fff'>P</text></svg>">
<style>
/* ─────────────────────────────────────────────
   PTP Invest — direction 1a "Quiet Swiss"
   Helvetica, asymmetric, hairline rules.
   Type scale interpolates linearly between the
   designed 390px and 1280px frames.
   ───────────────────────────────────────────── */
:root{
  --ink:#0a0a0a;
  --statement:#0a0a0a;
  --support:#6f6f6f;
  --places:#8f8f8f;
  --copyright:#9a9a9a;
  --rule:#dcdcdb;
  --font:Helvetica,'Helvetica Neue',Arial,sans-serif;

  /* 28px @390 → 52px @1280 */
  --pad-y:clamp(1.75rem, 1.09269rem + 2.69663vw, 3.25rem);
  /* 24px @390 → 64px @1280 */
  --pad-x:clamp(1.5rem, 0.40449rem + 4.49438vw, 4rem);
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

body{
  background:#ffffff;
  color:var(--ink);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  padding:var(--pad-y) var(--pad-x);
}

a{color:var(--ink);text-decoration:none}
a:hover{color:var(--ink);text-decoration:underline}
a:focus-visible{outline:1px solid var(--ink);outline-offset:.375rem}

/* ── header ─────────────────────────────────── */
.head{
  display:flex;
  flex-direction:column;
  gap:.625rem;
}

.wordmark{
  /* 13px @390 → 15px @1280 */
  font-size:clamp(.8125rem, .75772rem + .22472vw, .9375rem);
  font-weight:700;
  letter-spacing:.38em;
  color:var(--ink);
  white-space:nowrap;
}

.places{
  /* 12px @390 → 13px @1280 */
  font-size:clamp(.75rem, .72261rem + .11236vw, .8125rem);
  letter-spacing:.1em;
  color:var(--places);
}

/* ── rules ──────────────────────────────────── */
.rule{border-top:1px solid var(--rule)}
/* 20px @390 → 24px @1280 */
.rule--top{margin-top:clamp(1.25rem, 1.14045rem + .44944vw, 1.5rem)}
/* 18px @390 → 24px @1280 */
.rule--bottom{margin-bottom:clamp(1.125rem, .96067rem + .67416vw, 1.5rem)}

/* ── statement ──────────────────────────────── */
.body{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:3rem 0;
}

h1{
  /* 33px @390 → 58px @1280 */
  font-size:clamp(2.0625rem, 1.37781rem + 2.80899vw, 3.625rem);
  line-height:1.14;
  font-weight:500;
  letter-spacing:-.015em;
  color:var(--statement);
  max-width:56.25rem;
  text-wrap:pretty;
}

.support{
  /* 24px @390 → 32px @1280 */
  margin-top:clamp(1.5rem, 1.28090rem + .89888vw, 2rem);
  /* 15.5px @390 → 18px @1280 */
  font-size:clamp(.96875rem, .90028rem + .28090vw, 1.125rem);
  line-height:1.5;
  font-weight:400;
  color:var(--support);
}

/* ── footer ─────────────────────────────────── */
.foot{
  display:flex;
  flex-direction:column;
  gap:.5rem;
}

.email{
  /* 15px @390 → 16px @1280 */
  font-size:clamp(.9375rem, .90261rem + .11236vw, 1rem);
}

.copyright{
  /* 12px @390 → 12.5px @1280 */
  font-size:clamp(.75rem, .73631rem + .05618vw, .78125rem);
  color:var(--copyright);
}

/* ── wide: header and footer become rows ────── */
@media (min-width:40rem){
  .head,
  .foot{
    flex-direction:row;
    justify-content:space-between;
    align-items:baseline;
    gap:1.5rem;
  }
  h1{line-height:1.14;letter-spacing:-.015em}
  .support{line-height:1.5}
}

@media (max-width:39.999rem){
  h1{line-height:1.22;letter-spacing:-.01em}
  .support{line-height:1.55}
  .body{padding:2rem 0}
}
</style>
</head>
<body>

<header class="head">
  <span class="wordmark">PTP&nbsp;INVEST</span>
  <span class="places">Tallinn&nbsp;&nbsp;·&nbsp;&nbsp;Barcelona</span>
</header>

<div class="rule rule--top"></div>

<main class="body">
  <h1>Legacy isn&rsquo;t luck&nbsp;&mdash; it&rsquo;s crafted. At PTP&nbsp;Invest, we thrive where others hesitate.</h1>
  <p class="support">Markets shift, vision endures.</p>
</main>

<div class="rule rule--bottom"></div>

<footer class="foot">
  <a class="email" href="mailto:info@ptpinvest.ee">info@ptpinvest.ee</a>
  <span class="copyright">&copy; 2021&ndash;<span id="current-year">2026</span> PTP Invest O&Uuml;</span>
</footer>

<script>
document.getElementById('current-year').textContent = new Date().getUTCFullYear();
</script>

</body>
</html>
